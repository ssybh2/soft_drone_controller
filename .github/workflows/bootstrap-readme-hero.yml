name: Build README Hero

on:
  push:
    paths:
      - '.github/hero-chunks/**'
      - '.github/workflows/bootstrap-readme-hero.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-hero:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Rebuild hero image
        run: |
          mkdir -p docs/assets
          cat .github/hero-chunks/part_*.b64 | tr -d '\n' | base64 -d > docs/assets/soft_drone_hero.jpg
          file docs/assets/soft_drone_hero.jpg
          ls -lh docs/assets/soft_drone_hero.jpg

      - name: Commit hero image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/soft_drone_hero.jpg
          if git diff --cached --quiet; then
            echo "No hero changes to commit."
            exit 0
          fi
          git commit -m "docs: add README hero image"
          git push
