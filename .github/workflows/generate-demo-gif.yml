name: Generate README Demo GIF

on:
  push:
    paths:
      - 'docs/assets/demo.mov'
      - 'docs/assets/demo.mp4'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-gif:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select source video
        id: source
        shell: bash
        run: |
          if [ -f docs/assets/demo.mov ]; then
            echo "file=docs/assets/demo.mov" >> "$GITHUB_OUTPUT"
          elif [ -f docs/assets/demo.mp4 ]; then
            echo "file=docs/assets/demo.mp4" >> "$GITHUB_OUTPUT"
          else
            echo "No demo video found."
            exit 1
          fi

      - name: Generate optimized GIF
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -y \
            -i "${{ steps.source.outputs.file }}" \
            -t 7 \
            -vf "fps=7,scale=520:-1:flags=lanczos,split[s0][s1];[s0]palettegen=max_colors=32[p];[s1][p]paletteuse=dither=bayer:bayer_scale=3" \
            -loop 0 \
            docs/assets/demo.gif

      - name: Switch README to GIF
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('README.md')
          text = p.read_text()
          text = text.replace('docs/assets/demo-placeholder.svg', 'docs/assets/demo.gif')
          text = text.replace('Demo video coming soon · upload `docs/assets/demo.mov` or `demo.mp4`', 'Auto-playing real-flight preview')
          p.write_text(text)
          PY

      - name: Commit generated preview
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/demo.gif README.md
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "docs: generate auto-playing flight demo"
          git push
